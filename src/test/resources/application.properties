spring.application.name=permission-api

# In-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Kafka (disabled for tests)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=permission-api-test-group
kafka.consumer.enabled=false

# Kafka Topics
kafka.topics.user-registration=user-registration
kafka.topics.account-registration=account-registration
